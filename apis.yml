aid: usenarrative
name: Narrative Sports
description: Narrative Sports (Narrative AI Inc., YC Fall 2025, listed by Y Combinator
  as "usenarrative") is an AI-powered sports content platform that automates the
  creation and distribution of broadcast-ready highlight videos for broadcasters,
  teams, and leagues. Its API ingests live SRT streams for soccer and MMA, detects
  key moments in real time, and returns rendered clips in multiple aspect ratios,
  single-game recaps, multi-game highlight packages, and OTIO edit timelines.
