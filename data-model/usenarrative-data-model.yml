entities:
- name: Task
  description: 'A live-stream processing job. Creating a task launches a worker and
    returns a per-task SRT ingest URL. Statuses: queued, running, ready, completed,
    error, failed, stopped.'
  schemas: [CreateTaskRequest, CreateTaskResponse, TaskInfo, TaskResult, GetTaskInfoResponse, ListTasksResponse]
- name: Project
  description: The game/event generated from a task's processed stream; the anchor
    for highlights, recaps, and package options.
  schemas: [HighlightOptionsResponse, ProjectFightFilter]
- name: Highlight
  description: An AI-detected key moment clip with metadata (event type, and for
    MMA fight_number/round_number/fight_name), rendered video and OTIO edit data.
  schemas: [HighlightMetadata, GetHighlightResponse, ListHighlightsResponse, SignedUrlResponse, BatchSignedUrlRequest, BatchSignedUrlResponse]
- name: HighlightPackage
  description: A multi-game highlight package assembled from multiple projects.
  schemas: [CreateMultiGamePackageRequest, CreateMultiGamePackageResponse, MultiGamePackageResponse, MultiGamePackageListItem, ListMultiGamePackagesResponse, BatchMultiGamePackagesResponse]
- name: Recap
  description: A single-game recap generated from a project's OTIO-ready highlights,
    with target duration and event-type steering.
  schemas: [CreatePublicRecapRequest, CreatePublicRecapResponse, PublicRecapResponse, ListPublicRecapsResponse, BatchPublicRecapsResponse, RecapOptions]
